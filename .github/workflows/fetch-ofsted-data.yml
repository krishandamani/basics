name: Fetch Ofsted School Data

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 1 * *"  # first of each month at 03:00 UTC

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/property-search-automation-DJjr9

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install requests

      - name: Fetch Ofsted ratings from GIAS
        env:
          APIFY_API_KEY: ${{ secrets.APIFY_API_KEY }}
        run: python property-hunter/scripts/fetch_ofsted_data.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add property-hunter/src/ofsted_by_district.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: refresh Ofsted school ratings data"
            git push origin claude/property-search-automation-DJjr9
          fi
