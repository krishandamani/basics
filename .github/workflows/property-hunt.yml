name: Property Hunt

# Runs automatically every 6 hours, or manually via the "Run workflow" button
on:
  schedule:
    - cron: '0 */6 * * *'   # 00:00, 06:00, 12:00, 18:00 UTC every day
  workflow_dispatch:           # Adds a "Run workflow" button in the Actions tab

jobs:
  hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: property-hunter/requirements.txt

      - name: Install Python dependencies
        run: pip install -r property-hunter/requirements.txt

      - name: Install Playwright browser
        run: playwright install chromium --with-deps

      - name: Run property search
        env:
          # Store your Gmail App Password as a GitHub Secret named GMAIL_APP_PASSWORD
          # GitHub repo → Settings → Secrets and variables → Actions → New repository secret
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python property-hunter/main.py once
