name: Generate Search URLs

# Run this ONCE manually to resolve Rightmove locationIdentifiers and
# commit them to config.yaml. After that, the property-hunt workflow
# always has valid URLs for the Apify actor.
on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: property-hunter/requirements.txt

      - name: Install Python dependencies
        run: pip install -r property-hunter/requirements.txt

      - name: Generate search URLs
        run: python property-hunter/main.py build-urls

      - name: Commit updated config.yaml (if changed)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add property-hunter/config/config.yaml
          if git diff --cached --quiet; then
            echo "No changes to config.yaml — URLs may already be set, or Rightmove API was unreachable."
          else
            git commit -m "Auto-generate Rightmove search URLs via locationIdentifier lookup"
            git push
          fi
