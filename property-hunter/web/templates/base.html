<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Property Hunter{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>
  <style>
    [x-cloak] { display: none !important; }
    .src-rightmove   { background: #00703c; color: #fff; }
    .src-zoopla      { background: #7c3aed; color: #fff; }
    .src-onthemarket { background: #c2410c; color: #fff; }
    .src-openrent    { background: #1d4ed8; color: #fff; }
  </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-900"
      x-data="{ searchRunning: {{ 'true' if search_state.running else 'false' }} }">

<!-- Navigation -->
<nav class="bg-white border-b border-slate-200 sticky top-0 z-50 shadow-sm">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 flex items-center gap-4 h-14">

    <a href="/" class="font-bold text-lg text-indigo-600 shrink-0 tracking-tight">
      🏠 Property Hunter
    </a>

    <div class="flex gap-1 ml-2">
      <a href="/" class="text-sm font-medium px-3 py-1.5 rounded-lg
        {{ 'bg-indigo-50 text-indigo-700' if request.path == '/' else 'text-slate-600 hover:bg-slate-100' }}
        transition-colors">All</a>
      <a href="/map" class="text-sm font-medium px-3 py-1.5 rounded-lg
        {{ 'bg-indigo-50 text-indigo-700' if request.path == '/map' else 'text-slate-600 hover:bg-slate-100' }}
        transition-colors">Map</a>
      <a href="/favourites" class="text-sm font-medium px-3 py-1.5 rounded-lg
        {{ 'bg-indigo-50 text-indigo-700' if request.path == '/favourites' else 'text-slate-600 hover:bg-slate-100' }}
        transition-colors">Saved ❤️</a>
    </div>

    <div class="ml-auto flex items-center gap-3">
      <!-- Last ran info -->
      {% if search_state.last_ran %}
      <span class="text-xs text-slate-400 hidden sm:block">Last run: {{ search_state.last_ran }}</span>
      {% endif %}
      {% if search_state.error %}
      <span class="text-xs text-red-500" title="{{ search_state.error }}">⚠ Error</span>
      {% endif %}

      <!-- Searching indicator -->
      <span x-show="searchRunning" x-cloak
        class="text-xs font-medium text-amber-600 flex items-center gap-1.5">
        <svg class="animate-spin h-3 w-3" viewBox="0 0 24 24" fill="none">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8z"/>
        </svg>
        Searching…
      </span>

      <!-- Run search button -->
      <button
        x-show="!searchRunning"
        @click="
          searchRunning = true;
          fetch('/api/run-search', {method: 'POST'})
            .then(() => {
              let poll = setInterval(() => {
                fetch('/api/search-status').then(r => r.json()).then(s => {
                  if (!s.running) {
                    clearInterval(poll);
                    searchRunning = false;
                    location.reload();
                  }
                });
              }, 3000);
            });
        "
        class="text-sm font-medium bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg transition-colors flex items-center gap-1.5"
      >
        🔍 <span class="hidden sm:inline">Search now</span>
      </button>
    </div>
  </div>
</nav>

<!-- Main content -->
<main class="max-w-7xl mx-auto px-4 sm:px-6 py-6">
  {% block content %}{% endblock %}
</main>

</body>
</html>
