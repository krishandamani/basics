<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Property Hunter{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>
  <style>
    [x-cloak] { display: none !important; }
    .src-rightmove   { background: #00703c; color: #fff; }
    .src-zoopla      { background: #7c3aed; color: #fff; }
    .src-onthemarket { background: #c2410c; color: #fff; }
    .src-openrent    { background: #1d4ed8; color: #fff; }
    .src-savills     { background: #000000; color: #fff; }
    .src-knightfrank { background: #8b0000; color: #fff; }
    .type-sale { background: #eff6ff; color: #1d4ed8; border: 1px solid #bfdbfe; }
    .type-rent { background: #f0fdf4; color: #15803d; border: 1px solid #bbf7d0; }
    .price-drop { background: #fef2f2; color: #b91c1c; border: 1px solid #fecaca; }
  </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-900"
      x-data="{
        searchRunning: {{ 'true' if search_state.running else 'false' }},
        elapsed: {{ search_state.get('elapsed_seconds', 0) or 0 }},
        _poll: null,
        _timer: null,
        startPolling() {
          if (this._poll) return;
          this._timer = setInterval(() => this.elapsed++, 1000);
          this._poll = setInterval(() => {
            fetch('/api/search-status').then(r => r.json()).then(s => {
              if (s.elapsed_seconds) this.elapsed = s.elapsed_seconds;
              if (!s.running) {
                clearInterval(this._poll); this._poll = null;
                clearInterval(this._timer); this._timer = null;
                this.searchRunning = false;
                location.reload();
              }
            }).catch(() => {});
          }, 5000);
        }
      }"
      x-init="if (searchRunning) startPolling()">

<!-- Navigation -->
<nav class="bg-white border-b border-slate-200 sticky top-0 z-50 shadow-sm">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 flex items-center gap-3 h-14">

    <a href="/" class="font-bold text-base sm:text-lg text-indigo-600 shrink-0 tracking-tight">
      🏠 <span class="hidden xs:inline">Property Hunter</span>
    </a>

    <div class="flex gap-0.5 ml-1">
      <a href="/" class="text-sm font-medium px-3 py-2 rounded-lg
        {{ 'bg-indigo-50 text-indigo-700' if request.path == '/' else 'text-slate-600 hover:bg-slate-100' }}
        transition-colors">All</a>
      <a href="/map" class="text-sm font-medium px-3 py-2 rounded-lg
        {{ 'bg-indigo-50 text-indigo-700' if request.path == '/map' else 'text-slate-600 hover:bg-slate-100' }}
        transition-colors">Map</a>
      <a href="/favourites" class="text-sm font-medium px-3 py-2 rounded-lg
        {{ 'bg-indigo-50 text-indigo-700' if request.path == '/favourites' else 'text-slate-600 hover:bg-slate-100' }}
        transition-colors">Saved ❤️</a>
    </div>

    <div class="ml-auto flex items-center gap-2">
      {% if search_state.last_ran %}
      <span class="text-xs text-slate-400 hidden md:block">{{ search_state.last_ran }}</span>
      {% endif %}
      {% if search_state.error %}
      <span class="text-xs text-red-500 hidden sm:block" title="{{ search_state.error }}">⚠ Error</span>
      {% endif %}

      <!-- Searching indicator — shown whenever searchRunning is true -->
      <span x-show="searchRunning" x-cloak
        title="Fetching from Rightmove, Zoopla, OnTheMarket, Savills via Apify — takes 3–8 min"
        class="text-xs font-medium text-amber-600 flex items-center gap-1.5 shrink-0">
        <svg class="animate-spin h-3.5 w-3.5" viewBox="0 0 24 24" fill="none">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8z"/>
        </svg>
        <span class="hidden sm:inline">
          Searching…<span x-show="elapsed >= 30"
            x-text="' ' + Math.floor(elapsed/60) + 'm ' + (elapsed%60) + 's'"></span>
        </span>
        <span class="sm:hidden" x-show="elapsed >= 30"
          x-text="Math.floor(elapsed/60) + 'm'"></span>
      </span>

      <!-- Search now button -->
      <button
        x-show="!searchRunning"
        @click="
          searchRunning = true;
          elapsed = 0;
          fetch('/api/run-search', {method: 'POST'})
            .then(() => startPolling())
            .catch(() => { searchRunning = false; });
        "
        class="text-sm font-medium bg-indigo-600 hover:bg-indigo-700 active:bg-indigo-800
               text-white px-3 sm:px-4 py-2 rounded-lg transition-colors flex items-center gap-1.5 shrink-0"
      >
        🔍 <span>Search now</span>
      </button>
    </div>
  </div>
</nav>

<!-- Main content -->
<main class="max-w-7xl mx-auto px-4 sm:px-6 py-5">
  {% block content %}{% endblock %}
</main>

</body>
</html>
